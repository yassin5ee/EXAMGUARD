# Hote par defaut : PWA frontoffice, servie a la racine du sous-domaine du projet.
default.path=/var/opt/wildfly/www/root
default.aliases=examguard.tr3m0x.me
# ATTENTION : *.domains n'est utilise QUE dans le motif d'origine CORS, jamais
# comme nom d'hote -- c'est *.aliases qui porte le nom reel. Les points y sont
# donc ecrits [.], forme reconnue comme point litteral par le moteur d'expressions
# regulieres. Le CLI de WildFly depouille toutes les contre-obliques, ce qui rend
# \. inutilisable : sans [.], le point redevient un joker et un domaine voisin
# (examguard-tr3m0x.me) passerait le controle d'origine.
default.domains=examguard[.]tr3m0x[.]me
